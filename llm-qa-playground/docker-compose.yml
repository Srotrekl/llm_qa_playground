services:
  ollama:
    image: ollama/ollama:latest
    container_name: llm-qa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'llama3.2:1b' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: llm-qa-ollama-init
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_HOST=ollama:11434
      - MODEL_NAME=${MODEL_NAME:-llama3.2:1b}
    restart: "no"

  test-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    container_name: llm-qa-test-runner
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL_NAME=${MODEL_NAME:-llama3.2:1b}
      - JUDGE_MODEL=${JUDGE_MODEL:-llama3.2:1b}
    volumes:
      - ./allure-results:/app/allure-results
    profiles:
      - test

volumes:
  ollama_data:
