[pytest]
markers =
    llm: LLM behaviour tests
    api: Ollama API contract tests
    security: OWASP LLM Top 10 security tests
    slow: tests taking >10s
    performance: response-time and load tests
addopts = --strict-markers -ra
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
